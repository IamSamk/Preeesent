<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#111318">
<title>Preeesent Remote</title>
<style>
  :root { --bg:#111318; --card:#1c1f27; --text:#f2f3f5; --muted:#9aa0ab; --accent:#4f8cff; --danger:#e5484d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display:flex; flex-direction:column; padding:16px; gap:12px; user-select:none; }
  h1 { font-size:18px; margin:0; }
  .status { font-size:13px; color:var(--muted); }
  .status.ok { color:#3dd68c; } .status.err { color:var(--danger); }
  #pinBox { display:flex; gap:8px; }
  input { flex:1; font-size:20px; padding:12px; border-radius:12px; border:1px solid #333;
    background:var(--card); color:var(--text); letter-spacing:6px; text-align:center; }
  button { border:0; border-radius:16px; background:var(--card); color:var(--text);
    font-size:18px; font-weight:600; padding:14px; touch-action:manipulation; }
  button:active { transform:scale(.97); background:#2a2f3a; }
  .big { flex:1; display:flex; flex-direction:column; gap:12px; }
  .big button { flex:1; font-size:28px; }
  #next { background:var(--accent); flex:2; }
  .row { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .row button { font-size:15px; padding:12px 6px; }
  .hint { font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
  <h1>Preeesent Remote</h1>
  <div id="status" class="status">Enter the PIN shown on your laptop</div>
  <div id="pinBox">
    <input id="pin" inputmode="numeric" maxlength="4" placeholder="PIN">
    <button id="connect">Connect</button>
  </div>
  <div class="big">
    <button id="prev">&#9664; Back</button>
    <button id="next">Next &#9654;</button>
  </div>
  <div class="row">
    <button data-a="start">Start</button>
    <button data-a="black">Black</button>
    <button data-a="end">End</button>
  </div>
  <div class="hint">For volume-button control, use the Preeesent Android app.</div>
<script>
  const statusEl = document.getElementById('status');
  const pinEl = document.getElementById('pin');
  let pin = '';
  try { pin = localStorage.getItem('pin') || ''; } catch (e) {}
  const m = location.hash.match(/pin=(\d+)/);  // PIN from the laptop's QR code
  if (m) { pin = m[1]; history.replaceState(null, '', location.pathname); }
  pinEl.value = pin;

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status ' + (cls || ''); }

  async function connect() {
    pin = pinEl.value.trim();
    try {
      const r = await fetch('/api/ping', { headers: { 'X-Pin': pin } });
      const j = await r.json();
      if (j.ok) {
        setStatus('Connected to ' + j.name, 'ok');
        try { localStorage.setItem('pin', pin); } catch (e) {}
      } else setStatus('Wrong PIN', 'err');
    } catch (e) { setStatus('Cannot reach laptop', 'err'); }
  }

  async function send(action) {
    if (navigator.vibrate) navigator.vibrate(30);
    try {
      const r = await fetch('/api/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Pin': pin },
        body: JSON.stringify({ action })
      });
      if (r.status === 401) setStatus('Wrong PIN', 'err');
      else if (r.ok) setStatus('Sent: ' + action, 'ok');
    } catch (e) { setStatus('Cannot reach laptop', 'err'); }
  }

  document.getElementById('connect').onclick = connect;
  document.getElementById('next').onclick = () => send('next');
  document.getElementById('prev').onclick = () => send('prev');
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => send(b.dataset.a));
  // Bluetooth keyboards / clickers paired to the phone
  document.addEventListener('keydown', e => {
    if (e.target === pinEl) return;
    if (['ArrowRight', 'PageDown', ' ', 'AudioVolumeUp'].includes(e.key)) { e.preventDefault(); send('next'); }
    if (['ArrowLeft', 'PageUp', 'AudioVolumeDown'].includes(e.key)) { e.preventDefault(); send('prev'); }
  });
  if (pin) connect();
</script>
</body>
</html>
