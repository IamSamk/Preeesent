name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Preeesent.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Preeesent-apk
          path: Preeesent.apk

      - name: Publish to the "latest" release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Preeesent (latest build)
          prerelease: true
          files: Preeesent.apk
          body: |
            Download **Preeesent.apk** on your Android phone and open it to install.
            Built from ${{ github.sha }}.
